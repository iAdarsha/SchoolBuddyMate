<g class="head"><path d="M94 146L78 61Q76 39 98 49L145 78Q180 65 215 78L262 49Q284 39 282 61L266 146Q257 236 180 260Q103 236 94 146Z" fill="url(#fur)"/><path d="M93 73Q83 55 103 64L137 86Q112 101 93 119Z" fill="#fff1dd" class="ear"/><path d="M267 73Q277 55 257 64L223 86Q248 101 267 119Z" fill="#fff1dd" class="ear"/><path d="M112 141Q113 79 180 73Q247 79 248 141Q244 214 180 241Q116 214 112 141Z" fill="#f5dfc5"/><path d="M116 121Q125 78 180 72Q235 78 244 121Q218 101 180 105Q142 101 116 121Z" fill="#a34d2d"/>
