<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-label="Animated red panda School Buddy">
<defs><linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d87835"/><stop offset="1" stop-color="#9e402b"/></linearGradient><linearGradient id="knit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#789b72"/><stop offset="1" stop-color="#42654f"/></linearGradient></defs>
<style>.buddy{transform-origin:180px 380px;animation:bob 2.7s ease-in-out infinite}.head{transform-origin:180px 153px;animation:head 4s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s ease-in-out infinite}.mouth{transform-box:fill-box;transform-origin:center;animation:talk .78s ease-in-out infinite}.pawL{transform-origin:95px 285px;animation:waveL 2s ease-in-out infinite}.pawR{transform-origin:265px 285px;animation:waveR 2.2s ease-in-out infinite}.ear{animation:ear 3s ease-in-out infinite}.leaf{animation:leaf 1.7s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes head{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.06)}}@keyframes talk{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes waveL{0%,100%{transform:rotate(0)}45%{transform:rotate(-12deg)}70%{transform:rotate(5deg)}}@keyframes waveR{0%,100%{transform:rotate(0)}45%{transform:rotate(10deg)}70%{transform:rotate(-4deg)}}@keyframes ear{50%{transform:rotate(5deg)}}@keyframes leaf{50%{transform:rotate(20deg) scale(1.12)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g class="buddy"><ellipse cx="180" cy="407" rx="94" ry="13" fill="#49658a" opacity=".18"/>
