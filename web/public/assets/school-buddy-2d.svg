<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="School Buddy cartoon tutor">
<defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd7bd"/><stop offset="1" stop-color="#f2ae91"/></linearGradient><linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2cc6d0"/><stop offset="1" stop-color="#168bbd"/></linearGradient></defs>
<style>
.buddy{transform-origin:180px 370px;animation:float 3s ease-in-out infinite}.head{transform-origin:180px 146px;animation:head 5s ease-in-out infinite}.eyes{transform-origin:180px 145px;animation:blink 5s ease-in-out infinite}.mouth{transform-origin:180px 201px;animation:talk 1s ease-in-out infinite}.hand-left{transform-origin:90px 285px;animation:gesture-left 2.4s ease-in-out infinite}.hand-right{transform-origin:270px 286px;animation:gesture-right 2.1s ease-in-out infinite}.spark{animation:sparkle 1.8s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes head{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}@keyframes talk{0%,100%{transform:scaleY(.35)}45%,65%{transform:scaleY(1)}}@keyframes gesture-left{0%,100%{transform:rotate(0)}45%{transform:rotate(-9deg)}70%{transform:rotate(4deg)}}@keyframes gesture-right{0%,100%{transform:rotate(0)}40%{transform:rotate(8deg)}65%{transform:rotate(-3deg)}}@keyframes sparkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
