<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Happy School Buddy tutor">
<defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd9c0"/><stop offset="1" stop-color="#f2aa8f"/></linearGradient><linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#37d4d4"/><stop offset="1" stop-color="#1689bd"/></linearGradient></defs>
<style>.all{transform-origin:180px 370px;animation:bob 2.5s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s ease-in-out infinite}.mouth{transform-box:fill-box;transform-origin:center;animation:talk .8s ease-in-out infinite}.hands{transform-box:fill-box;transform-origin:center;animation:wave 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes wave{50%{transform:rotate(4deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
